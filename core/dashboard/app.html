<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0c1118">
<title>JARVIS</title>
<link rel="icon" href="/jarvis.ico">
<link rel="stylesheet" href="/app.css">
<script>window.JARVIS_TOKEN = "__JARVIS_TOKEN__";</script>
</head>
<body>
<div class="app" id="app">

  <nav class="nav" id="nav" aria-label="Pages">
    <a class="brand" href="/" data-nav><span class="mark" id="mark"></span>JARVIS</a>
    <a href="/" data-nav data-page="testing"><span>Testing</span><i id="nTesting"></i></a>
    <a href="/team" data-nav data-page="team"><span>Team</span><i id="nTeam"></i></a>
    <a href="/work" data-nav data-page="work"><span>Work</span><i id="nWork"></i></a>
    <a href="/money" data-nav data-page="money"><span>Money</span></a>
    <a href="/brain" data-nav data-page="brain"><span>Brain</span></a>
    <a href="/system" data-nav data-page="system"><span>System</span><i id="nSystem"></i></a>
    <div class="nav-foot" id="navFoot"></div>
  </nav>

  <header class="strip" id="strip">
    <div class="kpis" id="kpis"></div>
    <div class="strip-tools">
      <a class="ticker" id="ticker" href="/team" data-nav title="Agents at work"></a>
      <button class="btn amber" id="inboxBtn" type="button" aria-controls="inbox">Inbox <b id="inboxN">0</b></button>
      <button class="btn" id="talkBtn" type="button" aria-controls="talk">Talk</button>
    </div>
  </header>

  <main class="main" id="main" tabindex="-1"></main>

  <aside class="talk" id="talk" aria-label="Talk to JARVIS">
    <div class="talk-head">
      <span class="state" id="talkState"><span class="dot"></span><span id="talkStateText">Standing by</span></span>
      <button class="btn ghost" id="talkSpeak" type="button" title="Read replies aloud">Voice on</button>
      <button class="btn ghost" id="talkNew" type="button" title="Start a new conversation">New</button>
      <button class="btn ghost only-narrow" id="talkClose" type="button">Close</button>
    </div>
    <div class="talk-log" id="talkLog" aria-live="polite"></div>
    <div class="talk-chips" id="talkChips"></div>
    <form class="talk-form" id="talkForm">
      <textarea id="talkInput" rows="1" placeholder="Message JARVIS. Paste or drop an image." aria-label="Message JARVIS"></textarea>
      <div class="talk-row">
        <button class="btn ghost" id="talkAttach" type="button" title="Attach a file">Attach</button>
        <input type="file" id="talkFile" multiple hidden>
        <button class="btn ghost" id="talkMic" type="button" title="Speak to JARVIS">Mic</button>
        <span class="grow"></span>
        <button class="btn danger" id="talkStop" type="button" hidden>Stop</button>
        <button class="btn primary" id="talkSend" type="submit">Send</button>
      </div>
    </form>
  </aside>
</div>

<aside class="drawer" id="inbox" aria-label="Waiting for you" hidden>
  <div class="drawer-head"><h2>Waiting for you</h2><button class="btn ghost" data-close type="button">Close</button></div>
  <div class="drawer-body" id="inboxBody"></div>
</aside>

<aside class="drawer wide" id="record" aria-label="Record" hidden>
  <div class="drawer-head"><h2 id="recordTitle">Record</h2><button class="btn ghost" data-close type="button">Close</button></div>
  <div class="drawer-body" id="recordBody"></div>
</aside>

<dialog class="dialog" id="dialog"></dialog>
<div class="toasts" id="toasts" aria-live="assertive"></div>

<script src="/jarvis.js"></script>
<script src="/app.js"></script>
<script src="/page-testing.js"></script>
</body>
</html>
