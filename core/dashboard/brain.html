<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#020814">
<title>JARVIS Brain</title>
<link rel="icon" href="data:,">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Saira:wdth,wght@75..100,400..700&display=swap" rel="stylesheet">
<style>
:root {
  /* The Brain (T95): the stage's control-room palette. Deep blue, arc blue for JARVIS, ice for lines,
     amber only for what needs the owner, green for work running. */
  --abyss: #020814; --deep: #07142b; --deep-2: #0c1f40; --arc: #2e86ff; --ice: #a9dbff; --paper: #e8f1ff;
  --mute: #7d93b5; --signal: #ffb23e; --good: #57e3a6; --bad: #ff6b7a;
  --line: rgba(169, 219, 255, .16); --line-hi: rgba(169, 219, 255, .42);
  --glass: rgba(7, 20, 43, .86);
  --ui: "Saira", "Segoe UI", system-ui, sans-serif;
  --gutter: 16px; --side: 380px;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body { background: var(--abyss); color: var(--paper); font: 400 14px/1.45 var(--ui); font-stretch: 92%;
  -webkit-font-smoothing: antialiased; overflow: hidden; }
button, input { font: inherit; color: inherit; }
a { color: var(--ice); }
:focus-visible { outline: 2px solid var(--ice); outline-offset: 2px; }

.app { position: fixed; inset: 0; display: grid; grid-template-columns: 1fr var(--side); grid-template-rows: auto 1fr; }
header { grid-column: 1 / -1; display: flex; align-items: center; gap: 14px;
  padding: max(10px, env(safe-area-inset-top)) var(--gutter) 10px; border-bottom: 1px solid var(--line); }
.mark { font-weight: 650; font-stretch: 78%; font-size: 18px; letter-spacing: .14em; }
.mark span { color: var(--mute); font-weight: 450; }
.conn { display: inline-flex; align-items: center; gap: 7px; font-size: 12px; color: var(--mute); }
.conn i { width: 7px; height: 7px; border-radius: 50%; background: var(--bad); }
.conn.live i { background: var(--good); box-shadow: 0 0 8px var(--good); }
header nav { margin-left: auto; display: flex; gap: 4px; }
header nav a { padding: 5px 10px; border-radius: 6px; color: var(--mute); text-decoration: none; font-size: 13px; }
header nav a:hover, header nav a[aria-current] { color: var(--paper); background: var(--deep-2); }

/* ---------------------------------------------------------------- graph */
.graph { position: relative; min-width: 0; min-height: 0; overflow: hidden;
  background: radial-gradient(90% 80% at 50% 50%, #071a3a 0%, var(--abyss) 70%); }
canvas { position: absolute; inset: 0; width: 100%; height: 100%; touch-action: none; cursor: grab; display: block; }
canvas.dragging { cursor: grabbing; }
canvas.over { cursor: pointer; }

.tools { position: absolute; top: 12px; left: 12px; right: 12px; display: flex; gap: 8px; align-items: flex-start;
  pointer-events: none; z-index: 3; }
.tools > * { pointer-events: auto; }
.search { flex: 0 1 300px; min-width: 0; background: var(--glass); border: 1px solid var(--line); border-radius: 8px;
  padding: 7px 11px; outline: none; }
.search:focus { border-color: var(--line-hi); }
.btn { background: var(--glass); border: 1px solid var(--line); border-radius: 8px; padding: 7px 11px; cursor: pointer;
  white-space: nowrap; }
.btn:hover { border-color: var(--line-hi); }
.btn[aria-pressed="true"] { border-color: var(--ice); color: var(--ice); }
.stats { margin-left: auto; font-size: 12px; color: var(--mute); background: var(--glass); border: 1px solid var(--line);
  border-radius: 8px; padding: 7px 11px; white-space: nowrap; font-variant-numeric: tabular-nums; }

.filters { position: absolute; top: 54px; left: 12px; z-index: 3; width: 236px; max-height: calc(100% - 66px);
  overflow: auto; background: var(--glass); border: 1px solid var(--line); border-radius: 10px; padding: 8px; }
.filters[hidden] { display: none; }
.filters h3 { margin: 4px 6px 6px; font-size: 11px; font-weight: 600; letter-spacing: .12em; text-transform: uppercase;
  color: var(--mute); }
.filters label { display: flex; align-items: center; gap: 8px; padding: 4px 6px; border-radius: 6px; cursor: pointer;
  font-size: 13px; }
.filters label:hover { background: var(--deep-2); }
.filters input { accent-color: var(--arc); margin: 0; }
.filters .sw { width: 9px; height: 9px; border-radius: 50%; flex: none; }
.filters .n { margin-left: auto; color: var(--mute); font-variant-numeric: tabular-nums; font-size: 12px; }
.filters hr { border: 0; border-top: 1px solid var(--line); margin: 6px 4px; }

/* The JARVIS orb sits on the graph's centre node and follows pan and zoom. */
.orb { position: absolute; left: 0; top: 0; width: 64px; height: 64px; margin: -32px 0 0 -32px; border-radius: 50%;
  z-index: 2; cursor: pointer; border: 0; padding: 0; will-change: transform;
  background: radial-gradient(circle at 50% 50%, #e8f6ff 0 7%, #7cc4ff 14%, rgba(46, 134, 255, .55) 34%, rgba(46, 134, 255, .08) 62%, transparent 70%); }
.orb::before, .orb::after { content: ""; position: absolute; inset: 4px; border-radius: 50%;
  border: 1.5px solid rgba(169, 219, 255, .55); border-top-color: transparent; border-bottom-color: transparent; }
.orb::after { inset: -6px; border-width: 1px; border-color: rgba(169, 219, 255, .25); }
.orb.busy { animation: pulse 1.6s ease-in-out infinite; }
.orb.busy::before { animation: spin 2.2s linear infinite; border-color: var(--ice); border-top-color: transparent; border-bottom-color: transparent; }
.orb.busy::after { animation: spin 5s linear infinite reverse; border-color: rgba(87, 227, 166, .5); border-left-color: transparent; }
@keyframes pulse { 0%, 100% { box-shadow: 0 0 18px 2px rgba(46, 134, 255, .45); filter: brightness(1); }
  50% { box-shadow: 0 0 46px 14px rgba(46, 134, 255, .6); filter: brightness(1.35); } }
@keyframes spin { to { transform: rotate(360deg); } }
.orb-label { position: absolute; left: 0; top: 0; z-index: 2; transform: translate(-50%, 40px); pointer-events: none;
  font-size: 11px; letter-spacing: .16em; color: var(--ice); white-space: nowrap; text-shadow: 0 0 6px var(--abyss); }
.empty { position: absolute; inset: 0; display: grid; place-items: center; color: var(--mute); z-index: 1; padding: 20px;
  text-align: center; }
.empty[hidden] { display: none; }

/* ---------------------------------------------------------------- side panel */
aside { min-height: 0; display: flex; flex-direction: column; border-left: 1px solid var(--line); background: var(--deep); }
.tabs { display: flex; border-bottom: 1px solid var(--line); }
.tabs button { flex: 1; background: none; border: 0; padding: 10px; cursor: pointer; color: var(--mute);
  border-bottom: 2px solid transparent; font-weight: 550; letter-spacing: .06em; }
.tabs button[aria-selected="true"] { color: var(--paper); border-bottom-color: var(--arc); }
.pane { flex: 1; overflow: auto; padding: 4px var(--gutter) 24px; overscroll-behavior: contain; }
.pane[hidden] { display: none; }
section h2 { margin: 16px 0 6px; font-size: 11px; font-weight: 600; letter-spacing: .14em; text-transform: uppercase;
  color: var(--mute); display: flex; gap: 8px; }
section h2 .n { color: var(--ice); }
.now-line { margin-top: 12px; padding: 10px 12px; border: 1px solid var(--line); border-radius: 10px; background: var(--deep-2); }
.now-line b { color: var(--ice); font-weight: 600; }
.row { display: flex; gap: 8px; align-items: baseline; padding: 6px 8px; margin: 0 -8px; border-radius: 6px; }
button.row { width: calc(100% + 16px); background: none; border: 0; text-align: left; cursor: pointer; }
button.row:hover { background: var(--deep-2); }
.row .id { color: var(--mute); font-variant-numeric: tabular-nums; flex: none; min-width: 34px; font-size: 12px; }
.row .t { min-width: 0; flex: 1; overflow-wrap: anywhere; }
.row .sub { display: block; color: var(--mute); font-size: 12px; }
.chip { flex: none; font-size: 11px; padding: 1px 7px; border-radius: 999px; border: 1px solid var(--line); color: var(--mute); }
.chip.running, .chip.working, .chip.started, .chip.collaborating, .chip.in_progress { color: var(--good); border-color: rgba(87, 227, 166, .45); }
.chip.waiting_approval, .chip.blocked, .chip.assigned, .chip.pending { color: var(--signal); border-color: rgba(255, 178, 62, .45); }
.chip.stopped, .chip.failed { color: var(--bad); border-color: rgba(255, 107, 122, .45); }
.none { color: var(--mute); font-size: 13px; padding: 2px 0; }
.journal .row .id { min-width: 52px; }
.journal .owner .t { color: var(--paper); }
.journal .assistant .t { color: var(--ice); }

.detail h1 { font-size: 17px; font-weight: 600; margin: 14px 0 4px; line-height: 1.3; overflow-wrap: anywhere; }
.detail .kind { font-size: 11px; letter-spacing: .14em; text-transform: uppercase; color: var(--mute); display: flex; gap: 8px; align-items: center; }
.detail dl { display: grid; grid-template-columns: auto 1fr; gap: 3px 12px; margin: 12px 0; font-size: 13px; }
.detail dt { color: var(--mute); }
.detail dd { margin: 0; overflow-wrap: anywhere; }
.detail .body { white-space: pre-wrap; overflow-wrap: anywhere; font-size: 13px; line-height: 1.55;
  border-top: 1px solid var(--line); padding-top: 10px; margin-top: 10px; }
.ref { background: none; border: 0; padding: 0; color: var(--ice); cursor: pointer; text-decoration: underline;
  text-decoration-color: var(--line-hi); text-underline-offset: 2px; font: inherit; }
.links { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; }
.links .ref { text-decoration: none; border: 1px solid var(--line); border-radius: 999px; padding: 2px 9px; font-size: 12px;
  max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.links .ref:hover { border-color: var(--line-hi); }

/* ---------------------------------------------------------------- phone */
@media (max-width: 820px) {
  body { overflow-x: hidden; overflow-y: auto; }
  .app { position: static; display: flex; flex-direction: column; min-height: 100%; width: 100%; }
  header { gap: 10px; }
  .mark { font-size: 16px; }
  .conn span { display: none; }
  header nav a { padding: 5px 7px; }
  header nav a.wide { display: none; }
  .graph, aside { width: 100%; min-width: 0; }
  .graph { height: 56vh; min-height: 320px; flex: none; }
  .stats { display: none; }
  .search { flex: 1 1 auto; }
  .filters { width: auto; right: 12px; max-height: calc(100% - 66px); }
  aside { border-left: 0; border-top: 1px solid var(--line); flex: none; }
  .tabs { position: sticky; top: 0; z-index: 4; background: var(--deep); }
  .pane { overflow: visible; padding-bottom: max(24px, env(safe-area-inset-bottom)); }
}
@media (prefers-reduced-motion: reduce) {
  .orb.busy, .orb.busy::before, .orb.busy::after { animation-duration: 6s; }
}
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="mark">JARVIS <span>BRAIN</span></div>
    <div class="conn" id="conn"><i></i><span>Connecting</span></div>
    <nav>
      <a href="/">Stage</a>
      <a href="/brain" aria-current="page">Brain</a>
      <a href="/chat">Chat</a>
      <a class="wide" href="/hq">HQ</a>
    </nav>
  </header>

  <main class="graph" id="graph">
    <canvas id="canvas" aria-label="Knowledge graph of JARVIS's memory, agents, products, tasks and decisions"></canvas>
    <button class="orb" id="orb" aria-label="JARVIS status"></button>
    <div class="orb-label" id="orbLabel">JARVIS</div>
    <div class="empty" id="empty">Loading the brain…</div>
    <div class="tools">
      <input class="search" id="search" type="search" placeholder="Search memory, tasks, agents…" autocomplete="off" aria-label="Search the graph">
      <button class="btn" id="filterBtn" aria-pressed="false" aria-controls="filters">Filters</button>
      <button class="btn" id="fitBtn" title="Fit the whole graph">Fit</button>
      <div class="stats" id="stats"></div>
    </div>
    <div class="filters" id="filters" hidden></div>
  </main>

  <aside>
    <div class="tabs" role="tablist">
      <button role="tab" id="tabNow" aria-selected="true" aria-controls="paneNow">What I'm doing</button>
      <button role="tab" id="tabDetail" aria-selected="false" aria-controls="paneDetail">Details</button>
    </div>
    <div class="pane" id="paneNow" role="tabpanel"></div>
    <div class="pane detail" id="paneDetail" role="tabpanel" hidden>
      <p class="none" style="margin-top:16px">Tap a node in the graph to see it here.</p>
    </div>
  </aside>
</div>
<script src="/brain.js"></script>
</body>
</html>
