<!doctype html>
<html lang="en">

<style>
:root {
  /* The Monaco Estate: white marble, champagne gold, warm ivory, deep navy; smoked-glass panels over a sunlit scene. */
  --marble: #f5f3ee; --gold: #c6a46a; --gold-hi: #e2c48a; --ivory: #eae5da; --beige: #d8cebd; --navy: #17283a;
  --glass: rgba(18, 26, 37, .66); --glass-hi: rgba(18, 26, 37, .82); --edge: rgba(198, 164, 106, .55); --edge-soft: rgba(198, 164, 106, .28);
  --text: #f4efe6; --text-2: rgba(244, 239, 230, .72); --text-3: rgba(244, 239, 230, .5);
  --working: #3fcf8e; --waiting: #f0b43c; --idle: #a9b3c1; --blocked: #ff5a5f;
  --display: "Bodoni Moda", "Didot", "Bodoni 72", Georgia, serif;
  --ui: "Instrument Sans", "Segoe UI", system-ui, -apple-system, sans-serif;
  --ease-out: cubic-bezier(.22, 1, .36, 1); --ease-io: cubic-bezier(.65, 0, .35, 1);
  --pad: 18px;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: #e9dcc8; color: var(--text); font: 14px/1.45 var(--ui); -webkit-font-smoothing: antialiased; -webkit-tap-highlight-color: transparent; }
body { overflow: hidden; }
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; background: none; border: 0; padding: 0; text-align: inherit; }
a { color: inherit; }
:focus-visible { outline: 2px solid var(--gold-hi); outline-offset: 2px; border-radius: 8px; }
svg.i { width: 18px; height: 18px; flex: none; stroke: currentColor; fill: none; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }

/* ---------------------------------------------------------------- the estate, full bleed */
#stage { position: fixed; inset: 0; overflow: hidden; background: linear-gradient(#9ec4e6, #f2dcc2 55%, #3f8fb8 56%, #2a6f9f); }
#scene { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; outline: none; cursor: grab; }
#veil { position: absolute; inset: 0; z-index: 4; background: #efe3d1; pointer-events: none; transition: opacity 1.6s var(--ease-out); }
#veil.gone { opacity: 0; }
#nogl { position: absolute; z-index: 5; inset: 0; display: grid; place-items: center; padding: 24px; text-align: center; color: var(--navy); background: var(--marble); }
#nogl[hidden] { display: none; }
#labels { position: absolute; inset: 0; z-index: 2; pointer-events: none; overflow: hidden; }

/* glass, the one material for every overlay */
.glass { background: var(--glass); border: 1px solid var(--edge); border-radius: 14px; backdrop-filter: blur(14px) saturate(1.2); -webkit-backdrop-filter: blur(14px) saturate(1.2);
  box-shadow: 0 18px 40px -22px rgba(0, 0, 0, .6), inset 0 1px 0 rgba(255, 255, 255, .06); }
.card-title { display: flex; align-items: center; gap: 8px; margin: 0 0 10px; font-size: 11.5px; font-weight: 600; letter-spacing: .12em; text-transform: uppercase; color: var(--gold-hi); }
.card-title { white-space: nowrap; }
.card-title .more { margin-left: auto; text-transform: none; letter-spacing: 0; font-weight: 500; color: var(--text-2); font-size: 12px; }
.card-title .more:hover { color: var(--text); }
.quiet { color: var(--text-3); font-size: 12px; }
.lamp { width: 8px; height: 8px; border-radius: 50%; background: var(--idle); flex: none; }
.lamp.working { background: var(--working); box-shadow: 0 0 0 3px rgba(63, 207, 142, .2); }
.lamp.waiting { background: var(--waiting); }
.lamp.blocked { background: var(--blocked); }

/* building chips: icon, name, tasks and status, floating over each pavilion */
.chip3d { position: absolute; left: 0; top: 0; pointer-events: auto; display: grid; grid-template-columns: auto 1fr; gap: 0 9px; align-items: center;
  padding: 7px 12px 7px 9px; border-radius: 11px; background: var(--glass-hi); border: 1px solid var(--edge); box-shadow: 0 10px 22px -12px rgba(0, 0, 0, .6);
  will-change: transform, opacity; transition: box-shadow .3s var(--ease-out); text-align: left; white-space: nowrap; }
.chip3d:hover, .chip3d.on { box-shadow: 0 0 0 1px var(--gold-hi), 0 12px 26px -12px rgba(0, 0, 0, .7); }
.chip3d .ic { grid-row: span 2; width: 30px; height: 30px; border-radius: 8px; display: grid; place-items: center; color: var(--gold-hi); background: rgba(198, 164, 106, .14); }
.chip3d b { font-weight: 600; font-size: 13.5px; }
.chip3d small { display: flex; align-items: center; gap: 6px; color: var(--text-2); font-size: 11.5px; }
.chip3d.hq { padding: 8px 14px 8px 10px; }
.chip3d.hq b { font: 500 16px/1.1 var(--display); }

/* ---------------------------------------------------------------- top bar */
.top { position: fixed; z-index: 10; top: max(14px, env(safe-area-inset-top)); left: var(--pad); right: var(--pad); display: flex; align-items: flex-start; gap: 12px; pointer-events: none; }
.top > * { pointer-events: auto; }
.brand { display: flex; align-items: center; gap: 10px; padding: 8px 14px 8px 10px; text-decoration: none; }
.brand .crown { width: 30px; height: 30px; color: var(--gold-hi); }
.brand b { font: 500 19px/1 var(--display); letter-spacing: .03em; display: block; }
.brand small { font-size: 10.5px; color: var(--text-2); }
.online { display: flex; align-items: center; gap: 6px; font-size: 12px; padding: 6px 10px; border-radius: 999px; background: rgba(0, 0, 0, .25); margin-left: 6px; }
.online i { width: 7px; height: 7px; border-radius: 50%; background: var(--idle); }
.online.live i { background: var(--working); box-shadow: 0 0 0 3px rgba(63, 207, 142, .22); }
nav.pill { margin: 0 auto; display: flex; gap: 2px; padding: 5px; border-radius: 999px; }
nav.pill button { display: flex; align-items: center; gap: 7px; padding: 8px 14px; border-radius: 999px; font-size: 13px; font-weight: 500; color: var(--text-2); transition: background .25s, color .25s; }
nav.pill button:hover { color: var(--text); background: rgba(255, 255, 255, .06); }
nav.pill button[aria-current="true"] { color: #1b1408; background: linear-gradient(180deg, #e7cd96, #c6a46a); }
nav.pill .n { min-width: 20px; height: 20px; padding: 0 5px; border-radius: 10px; display: grid; place-items: center; font-size: 11px; font-weight: 600; border: 1px solid var(--edge); color: var(--gold-hi); }
nav.pill button[aria-current="true"] .n { border-color: rgba(27, 20, 8, .35); color: #1b1408; }
.right-chips { display: flex; gap: 8px; align-items: center; }
.mini { display: flex; align-items: center; gap: 8px; padding: 8px 12px; font-size: 12.5px; }
.mini b { font-weight: 600; }
.mini .i { color: var(--gold-hi); }
.mini[hidden] { display: none; }

/* ---------------------------------------------------------------- cards round the edges */
.card { position: fixed; z-index: 9; padding: 14px 16px; }
#overview { top: 86px; left: var(--pad); width: 300px; }
#activity { top: 86px; right: var(--pad); width: 300px; }
#quick { bottom: max(18px, env(safe-area-inset-bottom)); left: var(--pad); width: 330px; }
#perf { bottom: max(18px, env(safe-area-inset-bottom)); right: calc(var(--pad) + 62px); width: 300px; }
.big { font: 500 34px/1.05 var(--display); font-variant-numeric: lining-nums tabular-nums; }
.big small { font: 400 13px var(--ui); color: var(--text-2); margin-left: 6px; }
.delta { font-size: 11.5px; font-weight: 600; color: var(--gold-hi); margin-left: auto; text-transform: none; letter-spacing: 0; padding: 2px 8px; border-radius: 999px; border: 1px solid var(--edge-soft); }
.spark { display: block; width: 100%; height: 46px; margin: 8px 0 10px; }
.metrics { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.metrics div { display: grid; gap: 1px; }
.metrics span { font-size: 11.5px; color: var(--text-2); }
.metrics b { font-size: 16px; font-weight: 600; font-variant-numeric: tabular-nums; }
.source { margin: 10px 0 0; font-size: 11px; color: var(--text-3); line-height: 1.4; }
#activity ol { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; }
.act { display: grid; grid-template-columns: 34px 1fr auto; gap: 10px; align-items: center; width: 100%; }
.avatar { width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center; font-size: 12px; font-weight: 600; color: #fff; border: 1.5px solid var(--edge); background: var(--team, #3a4a5e); }
.act b { display: block; font-size: 13px; font-weight: 600; }
.act span { display: block; font-size: 12px; color: var(--text-2); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 190px; }
.act time { font-size: 11.5px; color: var(--text-3); align-self: start; padding-top: 2px; }
.qa { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
.qa button { display: grid; justify-items: center; gap: 6px; padding: 10px 4px 8px; border-radius: 10px; font-size: 11.5px; text-align: center; color: var(--text-2); line-height: 1.25; transition: background .25s, color .25s; }
.qa button:hover { background: rgba(255, 255, 255, .06); color: var(--text); }
.qa .i { width: 22px; height: 22px; color: var(--gold-hi); }
.perf { display: grid; grid-template-columns: 1fr auto; gap: 14px; align-items: end; }
.bars { display: flex; align-items: flex-end; gap: 5px; height: 64px; }
.bars i { flex: 1; min-width: 6px; border-radius: 2px 2px 0 0; background: linear-gradient(#e7cd96, #a8832f); opacity: .9; }
.bars i.zero { background: rgba(255, 255, 255, .12); height: 3px !important; }
.gauge { display: grid; justify-items: center; gap: 2px; }
.gauge svg { width: 74px; height: 74px; transform: rotate(-90deg); }
.gauge b { position: relative; margin-top: -50px; margin-bottom: 26px; font-size: 17px; font-weight: 600; }
.gauge span { font-size: 11.5px; color: var(--text-2); }
.views { position: fixed; z-index: 9; right: var(--pad); bottom: max(18px, env(safe-area-inset-bottom)); display: grid; gap: 4px; padding: 6px; }
.views button { display: grid; justify-items: center; gap: 3px; width: 46px; padding: 8px 0 6px; border-radius: 10px; font-size: 10.5px; color: var(--text-2); }
.views button:hover { background: rgba(255, 255, 255, .07); color: var(--text); }
.views button[aria-pressed="true"] { color: var(--gold-hi); background: rgba(198, 164, 106, .16); }
.views .i { width: 20px; height: 20px; }

/* walk mode: the hint and its buttons at the top, the stick (phones) bottom left */
#walk { position: absolute; z-index: 12; top: 74px; left: 50%; transform: translateX(-50%); display: flex; align-items: center; gap: 8px; padding: 6px 8px 6px 14px; max-width: calc(100% - 32px); font-size: 12.5px; color: var(--text-2); white-space: nowrap; }
#walk[hidden] { display: none; }
#walk button { padding: 6px 11px; border-radius: 9px; font-size: 12.5px; color: var(--text); background: rgba(255, 255, 255, .07); }
#walk button:hover { background: rgba(255, 255, 255, .13); }
#walk button.gold { color: #1a1406; background: var(--gold-hi); font-weight: 600; }
#walk button[hidden] { display: none; }
#stick { position: absolute; z-index: 12; left: 18px; bottom: 96px; width: 118px; height: 118px; border-radius: 50%; background: rgba(20, 26, 34, .35); border: 1px solid var(--edge); backdrop-filter: blur(8px); touch-action: none; }
#stick[hidden] { display: none; }
#stick i { position: absolute; left: 50%; top: 50%; width: 46px; height: 46px; margin: -23px 0 0 -23px; border-radius: 50%; background: rgba(255, 255, 255, .55); border: 1px solid var(--gold-hi); pointer-events: none; }
#stage.walking #scene { cursor: crosshair; }

/* toast and talk bar, bottom centre */
.center-bottom { position: fixed; z-index: 11; left: 50%; transform: translateX(-50%); bottom: max(18px, env(safe-area-inset-bottom)); width: min(560px, calc(100vw - 800px)); display: grid; grid-template-columns: minmax(0, 1fr); gap: 8px; }
#toast { display: flex; align-items: center; gap: 10px; padding: 9px 14px; font-size: 13px; text-align: left; width: 100%; }
#toast[hidden] { display: none; }
#toast .ok { width: 20px; height: 20px; border-radius: 50%; display: grid; place-items: center; background: var(--working); color: #0b2a1c; flex: none; }
#toast .ok svg { width: 13px; height: 13px; stroke-width: 2.6; }
#toast span { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
#toast time { color: var(--text-3); font-size: 12px; }
#caption { margin: 0; padding: 10px 14px; font-size: 14px; line-height: 1.45; max-height: 28vh; overflow: auto; }
#caption[hidden] { display: none; }
#caption small { display: block; color: var(--gold-hi); font-size: 11px; letter-spacing: .1em; text-transform: uppercase; margin-bottom: 2px; }
.talkbar { display: flex; align-items: center; gap: 8px; padding: 6px; border-radius: 999px; }
.talkbar .to { display: inline-flex; align-items: center; gap: 6px; padding: 5px 6px 5px 11px; border-radius: 999px; font-size: 12.5px; white-space: nowrap;
  color: #1b1408; background: linear-gradient(180deg, #e7cd96, #c6a46a); }
.talkbar .to b { font-weight: 600; }
.talkbar .to button { width: 20px; height: 20px; border-radius: 50%; display: grid; place-items: center; color: #1b1408; background: rgba(0, 0, 0, .12); font-size: 14px; line-height: 1; }
.talkbar .to[hidden] { display: none; }
.talkbar input { flex: 1; min-width: 0; border: 0; background: transparent; padding: 9px 6px; font-size: 14.5px; outline: none; color: var(--text); }
.talkbar input::placeholder { color: var(--text-3); }
.round { width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center; flex: none; border: 1px solid var(--edge); color: var(--gold-hi); transition: background .25s, transform .2s var(--ease-out); }
.round:active { transform: scale(.94); }
#mic.on { background: var(--working); color: #0b2a1c; border-color: var(--working); }
#send { background: linear-gradient(180deg, #e7cd96, #c6a46a); color: #1b1408; border-color: transparent; }
#stop[hidden] { display: none; }
#jstate { font-size: 12px; color: var(--text-3); white-space: nowrap; }
#demo-note { position: fixed; z-index: 12; top: 74px; left: 50%; transform: translateX(-50%); padding: 7px 14px; border-radius: 999px; font-size: 12.5px; font-weight: 600; background: #fff3d6; color: #5a3d00; border: 1px solid var(--gold); }
#demo-note[hidden] { display: none; }

/* ---------------------------------------------------------------- side panel (workspace, profile, tasks, analytics...) */
#panel { position: fixed; z-index: 30; top: 0; right: 0; bottom: 0; width: min(460px, 100vw); background: var(--glass-hi); border-left: 1px solid var(--edge);
  backdrop-filter: blur(20px) saturate(1.2); -webkit-backdrop-filter: blur(20px) saturate(1.2); overflow: auto; overscroll-behavior: contain;
  transform: translateX(105%); transition: transform .55s var(--ease-out); visibility: hidden; padding-bottom: 120px; }
body.panel-open #panel { transform: none; visibility: visible; }
.close { position: sticky; z-index: 3; float: right; top: max(14px, env(safe-area-inset-top)); margin: max(14px, env(safe-area-inset-top)) 14px 0 0;
  width: 38px; height: 38px; border-radius: 50%; display: grid; place-items: center; border: 1px solid var(--edge); background: var(--glass-hi); font-size: 19px; line-height: 1; color: var(--gold-hi); }
.p-head { padding: max(20px, env(safe-area-inset-top)) 22px 4px; }
.p-head .kicker { font-size: 11.5px; letter-spacing: .12em; text-transform: uppercase; color: var(--gold-hi); }
.p-head h2 { margin: 6px 0 0; font: 500 30px/1.12 var(--display); }
.p-head p { margin: 6px 0 0; color: var(--text-2); font-size: 13.5px; }
.p-body { padding: 0 22px; }
.p-body h3 { font-size: 11.5px; letter-spacing: .12em; text-transform: uppercase; color: var(--gold-hi); font-weight: 600; margin: 22px 0 9px; display: flex; gap: 8px; align-items: baseline; }
.p-body h3 .n { color: var(--text-3); letter-spacing: 0; }
.p-body ol, .p-body ul, .card ol { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }
.state-line { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--text-2); margin-top: 10px; }
.row { display: block; width: 100%; padding: 10px 12px; border-radius: 11px; background: rgba(255, 255, 255, .05); border: 1px solid transparent; text-align: left; }
button.row:hover { border-color: var(--edge-soft); background: rgba(255, 255, 255, .08); }
.row .t { font-size: 13.5px; line-height: 1.38; overflow-wrap: anywhere; }
.row .m { font-size: 12px; color: var(--text-3); margin-top: 4px; display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.row.ask { background: rgba(240, 180, 60, .1); border-color: rgba(240, 180, 60, .35); }
.row.blocked { background: rgba(255, 90, 95, .1); border-color: rgba(255, 90, 95, .3); }
.row.live { border-color: rgba(63, 207, 142, .4); }
.team-tag { display: inline-flex; align-items: center; gap: 5px; color: var(--text-2); font-weight: 500; }
.team-tag::before { content: ""; width: 7px; height: 7px; border-radius: 2px; background: var(--team, var(--idle)); }
.agent-row { display: grid; grid-template-columns: 38px 1fr auto; gap: 10px; align-items: center; }
.agent-row .avatar { width: 38px; height: 38px; }
.agent-row b { display: block; font-size: 14px; }
.agent-row span { display: block; font-size: 12.5px; color: var(--text-2); }
dl.facts { display: grid; grid-template-columns: auto 1fr; gap: 4px 14px; margin: 10px 0 0; font-size: 13px; }
dl.facts dt { color: var(--text-3); }
dl.facts dd { margin: 0; min-width: 0; overflow-wrap: anywhere; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.tag { font-size: 12.5px; padding: 5px 10px; border-radius: 999px; background: rgba(255, 255, 255, .06); border: 1px solid var(--edge-soft); }
.tag.ok::before, .tag.bad::before, .tag.unknown::before { content: ""; display: inline-block; width: 6px; height: 6px; border-radius: 50%; margin-right: 6px; vertical-align: 1px; background: var(--idle); }
.tag.ok::before { background: var(--working); }
.tag.bad { border-color: rgba(255, 90, 95, .5); }
.tag.bad::before { background: var(--blocked); }
.btns { display: flex; gap: 8px; margin-top: 12px; flex-wrap: wrap; }
.btn { padding: 8px 14px; border-radius: 10px; font-size: 13px; font-weight: 600; min-height: 38px; text-decoration: none; display: inline-flex; align-items: center; gap: 6px;
  border: 1px solid var(--edge); color: var(--text); transition: background .25s, transform .2s var(--ease-out); }
.btn:hover { background: rgba(255, 255, 255, .07); }
.btn:active { transform: scale(.97); }
.btn.gold { background: linear-gradient(180deg, #e7cd96, #c6a46a); color: #1b1408; border-color: transparent; }
.btn[disabled] { opacity: .5; cursor: default; }
.empty { color: var(--text-3); font-size: 13px; margin: 2px; }
.note { margin: 16px 0 0; font-size: 12px; color: var(--text-3); }
.desc { font-size: 13.5px; color: var(--text-2); white-space: pre-wrap; margin: 0; }
.tabs { display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px; padding: 4px; border-radius: 12px; background: rgba(255, 255, 255, .05); margin-bottom: 10px; }
.tabs button { padding: 8px 4px; border-radius: 9px; font-size: 12px; text-align: center; color: var(--text-2); }
.tabs button b { display: block; font: 500 19px/1.1 var(--display); color: var(--text); }
.tabs button[aria-selected="true"] { background: rgba(198, 164, 106, .2); color: var(--text); }
.preview { border-radius: 12px; overflow: hidden; background: #fbfaf7; color: #14243b; border: 1px solid var(--edge-soft); }
.preview .pbar { display: flex; justify-content: space-between; gap: 10px; padding: 8px 12px; font-size: 12px; color: #4a5b72; border-bottom: 1px solid rgba(20, 36, 59, .1); background: #f1ede5; }
.preview .pbar b { font-weight: 600; color: #14243b; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.preview .doc { max-height: 320px; overflow: auto; padding: 12px 14px; font-size: 13px; line-height: 1.55; }
.preview .doc h4 { font: 600 15px/1.3 var(--display); margin: 10px 0 4px; }
.preview .doc h4:first-child { margin-top: 0; }
.preview .doc p { margin: 0 0 6px; }
.preview .doc ul { margin: 0 0 6px; padding-left: 18px; }
.preview img { display: block; width: 100%; height: auto; max-height: 420px; object-fit: contain; background: #f3f3f3; }
.preview.none { padding: 14px; color: var(--text-3); background: rgba(255, 255, 255, .04); font-size: 13px; }
table.num { width: 100%; border-collapse: collapse; font-size: 12.5px; font-variant-numeric: tabular-nums; }
table.num th { text-align: left; font-weight: 500; color: var(--text-3); padding: 4px 6px; border-bottom: 1px solid var(--edge-soft); }
table.num td { padding: 5px 6px; border-bottom: 1px solid rgba(255, 255, 255, .05); }
table.num td.r, table.num th.r { text-align: right; }
.chat { display: grid; gap: 8px; }
.chat .msg { padding: 9px 12px; border-radius: 12px; font-size: 13.5px; max-width: 92%; white-space: pre-wrap; }
.chat .msg.owner { justify-self: end; background: rgba(198, 164, 106, .2); }
.chat .msg.jarvis { background: rgba(255, 255, 255, .06); }
.chat .msg small { display: block; font-size: 11px; color: var(--text-3); margin-bottom: 2px; }
.switch { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 10px 0; border-bottom: 1px solid rgba(255, 255, 255, .06); font-size: 13.5px; }
.switch input { width: 18px; height: 18px; accent-color: var(--gold); }
.switch select { background: rgba(255, 255, 255, .06); border: 1px solid var(--edge-soft); border-radius: 8px; padding: 6px 8px; max-width: 200px; }
select.pick, .assign select, .assign input { background: rgba(255, 255, 255, .06); color: var(--text); border: 1px solid var(--edge-soft); border-radius: 8px; padding: 6px 8px; font-size: 13px; }
select.pick option, .assign select option { color: #14243b; }
select.pick.saved { border-color: var(--working); }
.assign { display: grid; gap: 8px; }
.assign input { width: 100%; padding: 9px 10px; }
.assign-row { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.assign-row select { max-width: 160px; }
.assign .btn { min-height: 34px; padding: 6px 12px; }

/* ---------------------------------------------------------------- tablets and phones: the estate on top, cards below */
@media (max-width: 1180px) {
  #activity { display: none; }
  .center-bottom { width: min(520px, calc(100vw - 420px)); }
  #perf { display: none; }
}
@media (max-width: 860px) {
  body { overflow: auto; }
  #stage { position: relative; height: 62vh; min-height: 380px; }
  .top { position: absolute; flex-wrap: wrap; }
  nav.pill { order: 3; margin: 0; width: 100%; overflow-x: auto; scrollbar-width: none; }
  nav.pill button { padding: 7px 11px; flex: none; }
  .brand small, .right-chips .mini.weather span { display: none; }
  .right-chips { margin-left: auto; }
  .chip3d { padding: 3px; gap: 0; border-radius: 9px; }   /* icon badges; the name shows in the panel and the Agents list */
  .chip3d .ic { width: 26px; height: 26px; grid-row: auto; }
  .chip3d b, .chip3d small { display: none; }
  .chip3d.hq b { display: block; font-size: 13px; padding: 0 6px 0 4px; }
  .card, .views, #activity, #perf { position: static; display: block; width: auto; margin: 12px; }
  .stack { display: grid; padding-bottom: 150px; background: #1a222c; }
  .views { display: flex; justify-content: center; position: absolute; top: auto; bottom: 10px; right: 10px; margin: 0; z-index: 9; padding: 3px; gap: 0; }
  .views button { width: 38px; font-size: 0; gap: 0; padding: 8px 0; }
  #toast { display: none !important; }
  .center-bottom { position: fixed; width: calc(100vw - 16px); bottom: max(8px, env(safe-area-inset-bottom)); }
  #jstate { display: none; }
  #panel { top: auto; left: 0; width: 100%; height: 82vh; border-radius: 20px 20px 0 0; border-left: 0; border-top: 1px solid var(--edge); transform: translateY(105%); }
  #demo-note { position: absolute; top: 120px; width: calc(100% - 28px); text-align: center; white-space: normal; }
  #walk { top: auto; bottom: 58px; font-size: 12px; padding: 5px 6px 5px 10px; }
  #walk-hint { overflow: hidden; text-overflow: ellipsis; }
  #stick { left: 12px; bottom: 58px; width: 104px; height: 104px; }
}
@media (min-width: 861px) { .stack { display: contents; } #m-board { display: none; } }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition-duration: .01ms !important; } }
</style>
</head>
<body>

<div id="stage">
  <canvas id="scene" tabindex="-1" aria-label="3D view of the JARVIS HQ estate: HQ, the globe, and a pavilion for each team"></canvas>
  <div id="labels"></div>
  <div id="veil"></div>
  <div id="nogl" hidden></div>
  <header class="top">
    <a class="brand glass" href="/" aria-label="JARVIS HQ">
      <svg class="i crown"><use href="#i-crown"/></svg>
      <span><b>JARVIS HQ</b><small>Powered by Urban Supplied</small></span>
      <span class="online" id="conn" role="status"><i></i><span>Connecting</span></span>
    </a>
    <nav class="pill glass" aria-label="Sections">
      <button data-nav="home" aria-current="true"><svg class="i"><use href="#i-home"/></svg>Dashboard</button>
      <button data-nav="agents"><svg class="i"><use href="#i-people"/></svg>Agents <span class="n" id="n-agents"></span></button>
      <button data-nav="tasks"><svg class="i"><use href="#i-check"/></svg>Tasks <span class="n" id="n-tasks"></span></button>
      <button data-nav="analytics"><svg class="i"><use href="#i-chart"/></svg>Analytics</button>
      <button data-nav="settings"><svg class="i"><use href="#i-gear"/></svg>Settings</button>
    </nav>
    <div class="right-chips">
      <div class="mini glass weather" id="weather" hidden></div>
      <button class="mini glass" id="milestone"></button>
    </div>
  </header>
  <div class="views glass" role="group" aria-label="View">
    <button data-view="ceo"><svg class="i"><use href="#i-crown"/></svg>My office</button>
    <button data-view="reset"><svg class="i"><use href="#i-cube"/></svg>3D View</button>
    <button data-view="in"><svg class="i"><use href="#i-plus"/></svg>Zoom in</button>
    <button data-view="out"><svg class="i"><use href="#i-minus"/></svg>Zoom out</button>
    <button data-view="explore" aria-pressed="false"><svg class="i"><use href="#i-compass"/></svg>Explore</button>
    <button data-view="walk" aria-pressed="false"><svg class="i"><use href="#i-walk"/></svg>Walk</button>
    <button id="demo" aria-pressed="false"><svg class="i"><use href="#i-play"/></svg>Demo</button>
  </div>
  <div id="demo-note" hidden>Demo: sample sub-agents and a new hire, not real activity</div>
  <div id="walk" class="glass" role="group" aria-label="Walk mode" hidden>
    <span id="walk-hint"></span>
    <button id="walk-talk" class="gold" hidden></button>
    <button id="walk-eye">Over the shoulder</button>
    <button id="walk-office">My office</button>
    <button id="walk-leave">Leave</button>
  </div>
  <div id="stick" aria-label="Walk stick" hidden><i></i></div>
</div>

<div class="stack">
  <section class="card glass" id="overview" aria-label="Business overview"></section>
  <section class="card glass" id="activity" aria-label="Live activity"></section>
  <section class="card glass" id="m-board" aria-label="Tasks"></section>
  <section class="card glass" id="quick" aria-label="Quick actions">
    <h2 class="card-title">Quick actions</h2>
    <div class="qa">
      <button data-ask="Research a new product to test: "><svg class="i"><use href="#i-search"/></svg>New product research</button>
      <button data-ask="Creative, draft an ad concept for "><svg class="i"><use href="#i-spark"/></svg>Create ad concept</button>
      <button data-nav="analytics"><svg class="i"><use href="#i-doc"/></svg>View reports</button>
      <button data-nav="tasks"><svg class="i"><use href="#i-board"/></svg>Open task board</button>
    </div>
  </section>
  <section class="card glass" id="perf" aria-label="Agent performance"></section>
</div>

<div class="center-bottom">
  <button class="glass" id="toast" hidden></button>
  <p class="glass" id="caption" hidden aria-live="polite"></p>
  <form class="talkbar glass" id="talkform" autocomplete="off">
    <button type="button" class="round" id="mic" aria-label="Talk to JARVIS"><svg class="i"><use href="#i-mic"/></svg></button>
    <span class="to" id="to" hidden>To <b></b><button type="button" aria-label="Talk to JARVIS instead">&times;</button></span>
    <input id="say" type="text" placeholder="Talk to JARVIS, or name a team: “Creative, show me ad 4”" aria-label="Message JARVIS">
    <span id="jstate"></span>
    <button type="button" class="round" id="stop" aria-label="Stop" hidden><svg class="i"><use href="#i-stop"/></svg></button>
    <button type="submit" class="round" id="send" aria-label="Send"><svg class="i"><use href="#i-send"/></svg></button>
  </form>
</div>

<aside id="panel" role="dialog" aria-modal="false" aria-labelledby="p-title">
  <button class="close" id="close" aria-label="Close">&times;</button>
  <div id="p-content"></div>
</aside>

<script>window.JARVIS_TOKEN = "__JARVIS_TOKEN__";</script>
<script src="/jarvis.js"></script>
<script type="module" src="/hq.js"></script>
</body>
</html>
