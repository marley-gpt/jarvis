<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>JARVIS HQ</title>
<link rel="icon" href="data:,">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,500;0,6..96,600;1,6..96,500&family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
} }
</script>
<style>
:root {
  /* Riviera daylight: sky, harbour water, Carrara marble, champagne gold, navy ink. */
  --sky: #d6eaf7; --paper: #f6f5f2; --gold: #a8832f; --gold-soft: #e7d3a1;
  --ink: #14243b; --ink-2: #4a5b72; --ink-3: #7d8ba0; --hair: rgba(20, 36, 59, .12);
  --glass: rgba(255, 255, 255, .82); --glass-strong: rgba(255, 255, 255, .95);
  --working: #13a06f; --waiting: #d9960f; --idle: #9aa6b5; --blocked: #dc3540;
  --display: "Bodoni Moda", "Didot", "Bodoni 72", Georgia, serif;
  --ui: "Instrument Sans", "Segoe UI", system-ui, -apple-system, sans-serif;
  --ease-out: cubic-bezier(.22, 1, .36, 1); --ease-io: cubic-bezier(.65, 0, .35, 1);
  --talk-h: 74px;
}
* { box-sizing: border-box; }
html { scroll-behavior: smooth; scroll-padding-top: 12px; }
body { margin: 0; min-height: 100%; background: var(--paper); color: var(--ink); font: 15px/1.5 var(--ui);
  -webkit-font-smoothing: antialiased; -webkit-tap-highlight-color: transparent; padding-bottom: calc(var(--talk-h) + 28px); }
button, input { font: inherit; color: inherit; }
button { cursor: pointer; background: none; border: 0; padding: 0; text-align: inherit; }
a { color: inherit; }
:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; border-radius: 6px; }
.label-quiet { color: var(--ink-3); font-size: 12px; }

/* ---------------------------------------------------------------- header */
#bar { display: grid; grid-template-columns: auto 1fr auto; align-items: center; gap: 18px 24px;
  padding: max(16px, env(safe-area-inset-top)) 24px 14px; background: var(--paper); border-bottom: 1px solid var(--hair); }
.mark { text-decoration: none; display: grid; line-height: 1; }
.mark .word { font: 500 30px/1 var(--display); letter-spacing: .015em; }
.mark .word em { font-style: italic; color: var(--gold); }
.mark .sub { font-size: 12px; color: var(--ink-2); margin-top: 6px; }
.stats { display: flex; gap: 4px; margin: 0; flex-wrap: wrap; }
.stat { display: grid; padding: 4px 12px; border-radius: 10px; min-width: 70px; transition: background .25s; }
.stat:hover { background: rgba(20, 36, 59, .05); }
.stat dd { margin: 0; font: 500 24px/1.1 var(--display); font-variant-numeric: lining-nums tabular-nums; }
.stat dt { font-size: 12px; color: var(--ink-2); order: 2; white-space: nowrap; }
.stat.alert dd { color: var(--blocked); }
.side { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; justify-content: flex-end; }
.milestone { font-size: 13px; padding: 7px 12px; border-radius: 10px; background: #fff; border: 1px solid var(--hair); max-width: 280px; }
.milestone b { font-weight: 600; }
.milestone.unset { color: var(--ink-3); }
.target { display: grid; gap: 5px; min-width: 200px; font-size: 12.5px; }
.target .line { display: flex; justify-content: space-between; gap: 10px; }
.target b { font-weight: 600; font-variant-numeric: tabular-nums; }
.meter { position: relative; height: 6px; border-radius: 3px; background: rgba(20, 36, 59, .1); }
.meter i { position: absolute; inset: 0 auto 0 0; border-radius: 3px; background: var(--ink); transition: width .8s var(--ease-out); }
.meter s { position: absolute; top: -3px; bottom: -3px; width: 2px; background: var(--gold); border-radius: 1px; }
.conn { display: flex; align-items: center; gap: 7px; font-size: 12.5px; color: var(--ink-2); }
.conn i { width: 8px; height: 8px; border-radius: 50%; background: var(--idle); transition: background .4s; }
.conn.live i { background: var(--working); box-shadow: 0 0 0 3px rgba(19, 160, 111, .18); }

/* ---------------------------------------------------------------- main layout */
main { display: flex; flex-direction: column; gap: 22px; padding: 18px 24px 0; max-width: 1600px; margin: 0 auto; }
#stage-wrap { order: 1; }
#board { order: 2; }
#more { order: 3; }
.section-head { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; margin: 0 2px 10px; }
.section-head h2 { font: 500 24px/1.2 var(--display); margin: 0; }

/* ---------------------------------------------------------------- the 3D HQ */
#stage { position: relative; height: min(64vh, 680px); min-height: 420px; border-radius: 22px; overflow: hidden;
  background: linear-gradient(#8ec3ea, #dcefFa 55%, #2a7fb8 56%, #1665a3); box-shadow: 0 30px 60px -40px rgba(20, 36, 59, .6); }
#scene { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: pan-y; outline: none; cursor: grab; }
#veil { position: absolute; inset: 0; z-index: 4; background: var(--sky); pointer-events: none; transition: opacity 1.4s var(--ease-out); }
#veil.gone { opacity: 0; }
#labels { position: absolute; inset: 0; z-index: 2; pointer-events: none; overflow: hidden; }
.tag { position: absolute; left: 0; top: 0; pointer-events: auto; text-align: left; will-change: transform, opacity;
  display: grid; gap: 1px; max-width: 210px; padding: 6px 10px 7px; border-radius: 11px; background: var(--glass-strong);
  border: 1px solid rgba(255, 255, 255, .9); box-shadow: 0 8px 22px -12px rgba(20, 36, 59, .5); transition: box-shadow .3s var(--ease-out); }
.tag:hover, .tag.on { box-shadow: 0 0 0 2px var(--team, var(--ink)), 0 10px 26px -12px rgba(20, 36, 59, .55); }
.tag .row { display: flex; align-items: center; gap: 7px; font-weight: 600; font-size: 13px; }
.tag .row::before { content: ""; width: 4px; height: 13px; border-radius: 2px; background: var(--team); }
.tag .now { font-size: 11.5px; color: var(--ink-2); line-height: 1.35; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.tag.core-tag { background: rgba(20, 36, 59, .92); color: #fff; border-color: rgba(231, 211, 161, .6); }
.tag.core-tag .row::before { background: var(--gold-soft); }
.tag.core-tag .now { color: rgba(255, 255, 255, .75); }
.stage-tools { position: absolute; z-index: 3; left: 14px; bottom: 14px; display: flex; gap: 8px; flex-wrap: wrap; }
.stage-tools button { font-size: 12.5px; font-weight: 500; padding: 7px 12px; border-radius: 999px; background: var(--glass-strong);
  box-shadow: 0 6px 16px -10px rgba(20, 36, 59, .5); }
.stage-tools button[aria-pressed="true"] { background: var(--ink); color: #fff; }
#demo-note { position: absolute; z-index: 3; top: 14px; left: 50%; transform: translateX(-50%); font-size: 12.5px; font-weight: 600; white-space: nowrap;
  padding: 7px 14px; border-radius: 999px; background: #fff7e3; color: #6b4b00; border: 1px solid rgba(217, 150, 15, .5); }
#demo-note[hidden] { display: none; }
@media (max-width: 860px) { #demo-note { white-space: normal; text-align: center; width: calc(100% - 28px); } }
#nogl { position: absolute; z-index: 5; inset: 0; display: grid; place-items: center; padding: 24px; text-align: center; color: var(--ink-2); background: var(--paper); }
#nogl[hidden] { display: none; }
.lamp { width: 8px; height: 8px; border-radius: 50%; background: var(--idle); flex: none; margin-left: auto; }
.lamp.working { background: var(--working); animation: breathe 2.4s var(--ease-io) infinite; }
.lamp.waiting { background: var(--waiting); }
.lamp.blocked { background: var(--blocked); }
@keyframes breathe { 50% { box-shadow: 0 0 0 4px rgba(19, 160, 111, .2); } }

/* ---------------------------------------------------------------- the board */
.tabs { display: none; }
.cols { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 14px; align-items: start; }
.col { background: #fff; border: 1px solid var(--hair); border-radius: 18px; padding: 12px 12px 14px; min-height: 140px; }
.col h3 { display: flex; align-items: baseline; gap: 8px; margin: 2px 4px 10px; font-size: 14px; font-weight: 600; }
.col h3 .n { color: var(--ink-3); font-weight: 500; font-variant-numeric: tabular-nums; }
.col h3::before { content: ""; width: 8px; height: 8px; border-radius: 50%; align-self: center; background: var(--c, var(--idle)); }
.col[data-col="now"] { --c: var(--working); }
.col[data-col="ask"] { --c: var(--waiting); }
.col[data-col="done"] { --c: var(--ink); }
.col[data-col="todo"] { --c: var(--idle); }
.col ol { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; max-height: 460px; overflow: auto; scrollbar-width: thin; }
.col .sub-h { font-size: 12px; color: var(--ink-3); margin: 8px 4px 2px; }
.item { display: block; width: 100%; padding: 9px 11px; border-radius: 12px; background: var(--paper); border: 1px solid transparent;
  transition: border-color .2s, background .2s; }
button.item:hover { border-color: var(--hair); background: #fff; }
.item .t { font-size: 13.5px; line-height: 1.38; overflow-wrap: anywhere; }
.item .m { font-size: 12px; color: var(--ink-3); margin-top: 4px; display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.team-tag { display: inline-flex; align-items: center; gap: 5px; color: var(--ink-2); font-weight: 500; }
.team-tag::before { content: ""; width: 7px; height: 7px; border-radius: 2px; background: var(--team, var(--ink-3)); }
.ask-card { padding: 9px 11px; border-radius: 12px; background: #fff9eb; border: 1px solid rgba(217, 150, 15, .35); }
.ask-card .t { font-size: 13.5px; line-height: 1.38; }
.ask-card .m { font-size: 12px; color: var(--ink-3); margin-top: 4px; display: flex; gap: 8px; flex-wrap: wrap; }
.item.blocked { background: #fdf0f0; border-color: rgba(220, 53, 64, .3); }
.item.live { border-color: rgba(19, 160, 111, .35); }
.btns { display: flex; gap: 8px; margin-top: 9px; flex-wrap: wrap; }
.btn { padding: 8px 14px; border-radius: 10px; font-size: 13px; font-weight: 600; min-height: 38px; text-decoration: none; display: inline-flex; align-items: center;
  border: 1px solid var(--hair); background: #fff; transition: background .25s, color .25s, transform .2s var(--ease-out); }
.btn:active { transform: scale(.97); }
.btn.yes { background: var(--ink); color: #fff; border-color: var(--ink); }
.btn[disabled] { opacity: .5; cursor: default; }
.empty { color: var(--ink-3); font-size: 13px; margin: 4px; }

/* ---------------------------------------------------------------- more: teams and allowance */
.more-grid { display: grid; grid-template-columns: 2fr 1fr; gap: 14px; }
.card-box { background: #fff; border: 1px solid var(--hair); border-radius: 18px; padding: 14px 16px 16px; }
.card-box h3 { margin: 0 0 10px; font-size: 14px; font-weight: 600; }
.card-box p { margin: 0 0 6px; font-size: 13px; color: var(--ink-2); }
.teams { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 8px; }
.team-row { display: grid; gap: 2px; padding: 10px 12px; border-radius: 12px; background: var(--paper); border: 1px solid transparent; }
.team-row:hover { border-color: var(--hair); background: #fff; }
.team-row .nm { display: flex; align-items: center; gap: 8px; font-weight: 600; font-size: 14px; }
.team-row .nm::before { content: ""; width: 4px; height: 14px; border-radius: 2px; background: var(--team); }
.team-row .who { font-size: 12px; color: var(--ink-3); }
.team-row .now { font-size: 12.5px; color: var(--ink-2); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.pace .meter { height: 10px; border-radius: 5px; margin: 12px 0 6px; }
.pace .meter i { border-radius: 5px; background: var(--working); }
.pace .meter s { top: -4px; bottom: -4px; }
.placeholder { display: inline-block; font-size: 11.5px; font-weight: 600; color: #6b4b00; background: #fff7e3; border: 1px solid rgba(217, 150, 15, .4);
  padding: 2px 8px; border-radius: 999px; margin-bottom: 8px; }

/* ---------------------------------------------------------------- talk bar */
#talk { position: fixed; z-index: 20; left: 50%; bottom: max(14px, env(safe-area-inset-bottom)); transform: translateX(-50%);
  width: min(760px, calc(100vw - 24px)); }
#caption { margin: 0 0 8px; padding: 10px 14px; border-radius: 14px; background: rgba(20, 36, 59, .95); color: #fff; font-size: 14px; line-height: 1.45;
  box-shadow: 0 16px 30px -20px rgba(20, 36, 59, .8); max-height: 30vh; overflow: auto; }
#caption[hidden] { display: none; }
#caption small { display: block; color: var(--gold-soft); font-size: 11.5px; margin-bottom: 2px; }
.talkbar { display: flex; align-items: center; gap: 8px; padding: 8px; border-radius: 999px; background: var(--glass-strong);
  backdrop-filter: blur(18px) saturate(1.3); -webkit-backdrop-filter: blur(18px) saturate(1.3); border: 1px solid rgba(20, 36, 59, .1);
  box-shadow: 0 20px 40px -24px rgba(20, 36, 59, .7); }
.talkbar input { flex: 1; min-width: 0; border: 0; background: transparent; padding: 10px 6px; font-size: 15px; outline: none; }
.round { width: 46px; height: 46px; border-radius: 50%; display: grid; place-items: center; flex: none; background: #fff; border: 1px solid var(--hair);
  transition: background .25s, transform .2s var(--ease-out); }
.round svg { width: 20px; height: 20px; }
.round:active { transform: scale(.94); }
#mic.on { background: var(--working); color: #fff; border-color: var(--working); animation: breathe 1.6s var(--ease-io) infinite; }
#send { background: var(--ink); color: #fff; border-color: var(--ink); }
#stop[hidden] { display: none; }
#jstate { font-size: 12px; color: var(--ink-3); white-space: nowrap; padding-right: 4px; }

/* ---------------------------------------------------------------- side panel */
#panel { position: fixed; z-index: 30; top: 0; right: 0; bottom: 0; width: min(460px, 100vw); background: var(--glass-strong);
  backdrop-filter: blur(22px) saturate(1.4); -webkit-backdrop-filter: blur(22px) saturate(1.4); border-left: 1px solid var(--hair);
  box-shadow: -30px 0 60px -40px rgba(20, 36, 59, .55); overflow: auto; overscroll-behavior: contain;
  transform: translateX(105%); transition: transform .55s var(--ease-out); visibility: hidden; padding-bottom: calc(var(--talk-h) + 40px); }
body.panel-open #panel { transform: none; visibility: visible; }
.close { position: sticky; z-index: 3; float: right; top: max(14px, env(safe-area-inset-top)); margin: max(14px, env(safe-area-inset-top)) 14px 0 0;
  width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center; background: #fff; border: 1px solid var(--hair); font-size: 20px; line-height: 1; }
.p-head { padding: max(18px, env(safe-area-inset-top)) 22px 6px; }
.p-head .swatch { display: block; width: 36px; height: 4px; border-radius: 2px; background: var(--team); margin-bottom: 12px; }
.p-head h2 { margin: 0; font: 500 30px/1.15 var(--display); }
.p-head p { margin: 4px 0 0; color: var(--ink-2); font-size: 13.5px; }
.p-body { padding: 0 22px; }
.p-body h3 { font-size: 13px; font-weight: 600; color: var(--ink-2); margin: 20px 0 8px; display: flex; gap: 8px; align-items: baseline; }
.p-body h3 .n { font-weight: 500; color: var(--ink-3); }
.p-body ol { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }
.state-line { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--ink-2); margin-top: 10px; }
.state-line .lamp { margin-left: 0; }
.agent { display: block; width: 100%; padding: 12px 14px; border-radius: 14px; background: #fff; border: 1px solid var(--hair); }
.agent + .agent { margin-top: 8px; }
button.agent:hover { border-color: rgba(20, 36, 59, .25); }
.agent .nm { display: flex; align-items: center; gap: 8px; font-weight: 600; }
.agent .nm small { font-weight: 400; color: var(--ink-3); font-size: 12px; }
.agent .ttl { font-size: 12.5px; color: var(--ink-2); margin-top: 1px; }
dl.facts { display: grid; grid-template-columns: auto 1fr; gap: 3px 12px; margin: 9px 0 0; font-size: 12.5px; }
dl.facts dt { color: var(--ink-3); }
dl.facts dd { margin: 0; min-width: 0; overflow-wrap: anywhere; }
.subs { margin-top: 9px; padding-left: 12px; border-left: 2px solid var(--team); display: grid; gap: 4px; font-size: 12.5px; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { font-size: 12.5px; padding: 5px 10px; border-radius: 999px; background: #fff; border: 1px solid var(--hair); }
.chip.plug::before { content: ""; display: inline-block; width: 6px; height: 6px; border-radius: 50%; background: var(--team, var(--ink-3)); margin-right: 6px; vertical-align: 1px; }
.preview { border-radius: 14px; overflow: hidden; background: #fff; border: 1px solid var(--hair); box-shadow: 0 18px 30px -24px rgba(20, 36, 59, .6); }
.preview .pbar { display: flex; justify-content: space-between; gap: 10px; padding: 9px 12px; font-size: 12px; color: var(--ink-2); border-bottom: 1px solid var(--hair); background: var(--paper); }
.preview .pbar b { font-weight: 600; color: var(--ink); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.preview .doc { max-height: 340px; overflow: auto; padding: 14px 16px; font-size: 13px; line-height: 1.55; }
.preview .doc h4 { font: 600 16px/1.3 var(--display); margin: 12px 0 4px; }
.preview .doc h4:first-child { margin-top: 0; }
.preview .doc p { margin: 0 0 6px; }
.preview .doc ul { margin: 0 0 6px; padding-left: 18px; }
.preview img { display: block; width: 100%; height: auto; max-height: 420px; object-fit: contain; background: #f3f3f3; }
.preview.none { padding: 16px; color: var(--ink-3); font-size: 13px; box-shadow: none; background: rgba(255, 255, 255, .6); }
.desc { font-size: 13.5px; color: var(--ink-2); white-space: pre-wrap; margin: 0; }
.note { margin: 22px 0 0; font-size: 12px; color: var(--ink-3); }

/* ---------------------------------------------------------------- phone: header, board, HQ, with the talk bar fixed */
@media (max-width: 860px) {
  body { font-size: 14.5px; }
  #bar { grid-template-columns: 1fr auto; gap: 10px; padding: max(12px, env(safe-area-inset-top)) 14px 12px; }
  .mark .word { font-size: 24px; }
  .mark .sub { display: none; }
  .stats { grid-column: 1 / -1; order: 3; display: grid; grid-template-columns: repeat(4, 1fr); gap: 2px; }
  .stat { min-width: 0; padding: 4px 6px; }
  .stat dd { font-size: 21px; }
  .stat dt { font-size: 11px; }
  .stat.agents { display: none; }
  .side { grid-column: 1 / -1; order: 4; justify-content: space-between; }
  .milestone { flex: 1 1 100%; max-width: none; }
  .target { flex: 1 1 100%; }
  .conn { position: absolute; top: max(18px, env(safe-area-inset-top)); right: 14px; }
  .conn span { display: none; }
  main { padding: 14px 12px 0; gap: 18px; }
  #board { order: 1; }
  #stage-wrap { order: 2; }
  #stage { height: 58vh; min-height: 360px; border-radius: 18px; }
  .tag { max-width: 140px; padding: 5px 8px; }
  .tag .now { display: none; }
  .tag .row { font-size: 12px; }
  .tabs { display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px; padding: 4px; border-radius: 14px; background: rgba(20, 36, 59, .06); margin-bottom: 10px; }
  .tabs button { padding: 8px 4px; border-radius: 10px; font-size: 12.5px; font-weight: 500; text-align: center; color: var(--ink-2); }
  .tabs button b { display: block; font: 500 19px/1.1 var(--display); color: var(--ink); }
  .tabs button[aria-selected="true"] { background: #fff; color: var(--ink); box-shadow: 0 4px 12px -8px rgba(20, 36, 59, .5); }
  .cols { display: block; }
  .col { display: none; }
  .col.show { display: block; }
  .col h3 { display: none; }
  .col ol { max-height: none; }
  .more-grid { grid-template-columns: 1fr; }
  #talk { width: calc(100vw - 16px); bottom: max(8px, env(safe-area-inset-bottom)); }
  #jstate { display: none; }
  #panel { top: auto; left: 0; width: 100%; height: 80vh; border-radius: 22px 22px 0 0; border-left: 0; transform: translateY(105%); }
}
@media (prefers-reduced-motion: reduce) {
  html { scroll-behavior: auto; }
  *, *::before, *::after { animation: none !important; transition-duration: .01ms !important; }
}
</style>
</head>
<body>
<header id="bar">
  <a class="mark" href="/" aria-label="JARVIS HQ"><span class="word">JARVIS <em>HQ</em></span><span class="sub">Urban Supplied</span></a>
  <dl class="stats" id="stats" aria-live="polite"></dl>
  <div class="side">
    <div class="milestone" id="milestone"></div>
    <div class="target" id="target"></div>
    <div class="conn" id="conn" role="status"><i></i><span>Connecting</span></div>
  </div>
</header>

<main>
  <section id="stage-wrap" aria-label="HQ">
    <div id="stage">
      <canvas id="scene" tabindex="-1" aria-label="3D view of JARVIS HQ: eight team suites around JARVIS, above the harbour"></canvas>
      <div id="labels"></div>
      <div class="stage-tools"><button id="reset-view">Whole floor</button><button id="demo" aria-pressed="false">Play demo</button></div>
      <div id="demo-note" hidden>Demo: sample sub-agents and a new hire, not real activity</div>
      <div id="veil"></div>
      <div id="nogl" hidden></div>
    </div>
  </section>

  <section id="board" aria-label="Status board">
    <div class="section-head"><h2>Status</h2><span class="label-quiet" id="board-note"></span></div>
    <div class="tabs" role="tablist" id="tabs"></div>
    <div class="cols">
      <div class="col" data-col="now"><h3>Now <span class="n"></span></h3><ol></ol></div>
      <div class="col" data-col="ask"><h3>Needs you <span class="n"></span></h3><ol></ol></div>
      <div class="col" data-col="done"><h3>Done <span class="n"></span></h3><ol></ol></div>
      <div class="col" data-col="todo"><h3>To do <span class="n"></span></h3><ol></ol></div>
    </div>
  </section>

  <section id="more" aria-label="Teams and allowance">
    <div class="more-grid">
      <div class="card-box"><h3>Teams</h3><div class="teams" id="teams"></div></div>
      <div class="card-box pace" id="allowance"></div>
    </div>
  </section>
</main>

<div id="talk">
  <p id="caption" hidden aria-live="polite"></p>
  <form class="talkbar" id="talkform" autocomplete="off">
    <button type="button" class="round" id="mic" aria-label="Talk to JARVIS"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg></button>
    <input id="say" type="text" placeholder="Talk to JARVIS, or name a team: “Creative, show me ad 4”" aria-label="Message JARVIS">
    <span id="jstate"></span>
    <button type="button" class="round" id="stop" aria-label="Stop" hidden><svg viewBox="0 0 24 24" fill="currentColor"><rect x="7" y="7" width="10" height="10" rx="2"/></svg></button>
    <button type="submit" class="round" id="send" aria-label="Send"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h13M13 6l6 6-6 6"/></svg></button>
  </form>
</div>

<aside id="panel" role="dialog" aria-modal="false" aria-labelledby="p-title">
  <button class="close" id="close" aria-label="Close">&times;</button>
  <div id="p-content"></div>
</aside>

<script>window.JARVIS_TOKEN = "__JARVIS_TOKEN__";</script>
<script src="/jarvis.js"></script>
<script type="module" src="/hq.js"></script>
</body>
</html>
