<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>JARVIS HQ</title>
<link rel="icon" href="data:,">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,500;0,6..96,600;1,6..96,500&family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
} }
</script>
<style>
:root {
  /* Riviera daylight: sky, harbour water, Carrara marble, champagne gold, navy ink. */
  --sky: #cfe6f6; --sea: #1665a3; --marble: #f5f4f1; --gold: #b8933f; --gold-soft: #e7d3a1;
  --ink: #14243b; --ink-2: #4a5b72; --ink-3: #7d8ba0; --hair: rgba(20, 36, 59, .12);
  --glass: rgba(255, 255, 255, .80); --glass-strong: rgba(255, 255, 255, .93);
  --working: #13a06f; --waiting: #d9960f; --idle: #9aa6b5; --blocked: #dc3540;
  --display: "Bodoni Moda", "Didot", "Bodoni 72", Georgia, serif;
  --ui: "Instrument Sans", "Segoe UI", system-ui, -apple-system, sans-serif;
  --ease-out: cubic-bezier(.22, 1, .36, 1); --ease-io: cubic-bezier(.65, 0, .35, 1);
  --panel-w: min(440px, 100vw);
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; overflow: hidden; background: var(--sky); color: var(--ink);
  font: 15px/1.5 var(--ui); -webkit-font-smoothing: antialiased; -webkit-tap-highlight-color: transparent; }
button { font: inherit; color: inherit; cursor: pointer; background: none; border: 0; padding: 0; }
a { color: inherit; }
:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; border-radius: 6px; }

#scene { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; outline: none;
  background: linear-gradient(#8ec3ea, #dcefFa 55%, #2a7fb8 56%, #1665a3); }
#scene.grab { cursor: grab; }
#veil { position: fixed; inset: 0; z-index: 30; background: var(--sky); pointer-events: none;
  transition: opacity 1.4s var(--ease-out); }
#veil.gone { opacity: 0; }

/* ---------------------------------------------------------------- header */
#bar { position: fixed; z-index: 10; top: 0; left: 0; right: 0; display: flex; align-items: center; gap: 22px;
  padding: max(14px, env(safe-area-inset-top)) 20px 12px; pointer-events: none; }
#bar > * { pointer-events: auto; }
.mark { text-decoration: none; display: grid; line-height: 1; padding: 10px 16px 9px; border-radius: 14px;
  background: var(--glass); backdrop-filter: blur(16px) saturate(1.3); -webkit-backdrop-filter: blur(16px) saturate(1.3);
  border: 1px solid rgba(255, 255, 255, .7); box-shadow: 0 10px 30px -18px rgba(20, 36, 59, .45); }
.mark .word { font: 500 27px/1 var(--display); letter-spacing: .02em; }
.mark .word em { font-style: italic; color: var(--gold); }
.mark .sub { font-size: 12px; color: var(--ink-2); margin-top: 5px; letter-spacing: .01em; }
.stats { display: flex; gap: 6px; margin: 0; padding: 6px; border-radius: 14px; background: var(--glass);
  backdrop-filter: blur(16px) saturate(1.3); -webkit-backdrop-filter: blur(16px) saturate(1.3);
  border: 1px solid rgba(255, 255, 255, .7); box-shadow: 0 10px 30px -18px rgba(20, 36, 59, .45); }
.stat { display: grid; padding: 4px 12px; border-radius: 10px; min-width: 64px; }
.stat dd { margin: 0; font: 500 22px/1.1 var(--display); font-variant-numeric: lining-nums tabular-nums; }
.stat dt { font-size: 11.5px; color: var(--ink-2); order: 2; white-space: nowrap; }
.stat.alert dd { color: var(--blocked); }
.conn { display: flex; align-items: center; gap: 7px; font-size: 12.5px; color: var(--ink-2); margin-left: auto;
  padding: 8px 12px; border-radius: 999px; background: var(--glass); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); }
.conn i { width: 8px; height: 8px; border-radius: 50%; background: var(--idle); transition: background .4s; }
.conn.live i { background: var(--working); box-shadow: 0 0 0 3px rgba(19, 160, 111, .18); }
.links { display: flex; gap: 6px; }
.links a { text-decoration: none; font-size: 13px; font-weight: 500; padding: 8px 13px; border-radius: 999px;
  background: var(--glass); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); white-space: nowrap; }
.links a.talk { background: var(--ink); color: #fff; }
.links a:hover { filter: brightness(1.06); }

/* ---------------------------------------------------------------- suite labels over the 3D scene */
#labels { position: fixed; inset: 0; z-index: 5; pointer-events: none; }
.tag { position: absolute; left: 0; top: 0; pointer-events: auto; text-align: left; will-change: transform, opacity;
  display: grid; gap: 1px; max-width: 220px; padding: 7px 11px 8px; border-radius: 12px; background: var(--glass-strong);
  border: 1px solid rgba(255, 255, 255, .9); box-shadow: 0 8px 22px -12px rgba(20, 36, 59, .5);
  transition: box-shadow .3s var(--ease-out), background .3s; }
.tag:hover, .tag.on { box-shadow: 0 0 0 2px var(--team, var(--ink)), 0 10px 26px -12px rgba(20, 36, 59, .55); }
.tag .row { display: flex; align-items: center; gap: 7px; font-weight: 600; font-size: 13.5px; }
.tag .row::before { content: ""; width: 4px; height: 14px; border-radius: 2px; background: var(--team); }
.tag .now { font-size: 12px; color: var(--ink-2); line-height: 1.35; display: -webkit-box; -webkit-line-clamp: 2;
  -webkit-box-orient: vertical; overflow: hidden; }
.tag .tool { font-size: 11.5px; color: var(--ink-3); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tag.core-tag { background: rgba(20, 36, 59, .9); color: #fff; border-color: rgba(231, 211, 161, .6); }
.tag.core-tag .row::before { background: var(--gold-soft); }
.tag.core-tag .now { color: rgba(255, 255, 255, .75); }
.lamp { width: 8px; height: 8px; border-radius: 50%; background: var(--idle); flex: none; margin-left: auto; }
.lamp.working { background: var(--working); animation: breathe 2.4s var(--ease-io) infinite; }
.lamp.waiting { background: var(--waiting); }
.lamp.blocked { background: var(--blocked); }
@keyframes breathe { 50% { box-shadow: 0 0 0 4px rgba(19, 160, 111, .2); } }

/* ---------------------------------------------------------------- sheets: Today board and suite panel */
.sheet { position: fixed; z-index: 12; background: var(--glass); color: var(--ink);
  backdrop-filter: blur(22px) saturate(1.4); -webkit-backdrop-filter: blur(22px) saturate(1.4);
  border: 1px solid rgba(255, 255, 255, .75); box-shadow: 0 30px 60px -30px rgba(20, 36, 59, .55);
  overflow: auto; overscroll-behavior: contain; scrollbar-width: thin; }
#today { top: 96px; right: 20px; bottom: 20px; width: 330px; border-radius: 20px; padding: 6px 18px 18px;
  transition: transform .55s var(--ease-out), opacity .4s; }
body.panel-open #today { transform: translateX(calc(100% + 40px)); opacity: 0; pointer-events: none; }
#panel { top: 0; right: 0; bottom: 0; width: var(--panel-w); border-radius: 22px 0 0 22px; padding: 0 0 28px;
  transform: translateX(105%); transition: transform .6s var(--ease-out); visibility: hidden; }
body.panel-open #panel { transform: none; visibility: visible; }
.grip { display: none; }
.sheet h2 { font: 500 26px/1.15 var(--display); margin: 16px 0 4px; letter-spacing: .005em; }
.sheet h3 { font-size: 13px; font-weight: 600; color: var(--ink-2); margin: 20px 0 8px; display: flex; gap: 8px; align-items: baseline; }
.sheet h3 .n { font-weight: 500; color: var(--ink-3); font-variant-numeric: tabular-nums; }
.sheet ol, .sheet ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }
.empty { color: var(--ink-3); font-size: 13px; margin: 0; }
.card { padding: 10px 12px; border-radius: 12px; background: rgba(255, 255, 255, .72); border: 1px solid var(--hair); }
.card .t { font-size: 13.5px; line-height: 1.38; }
.card .m { font-size: 12px; color: var(--ink-3); margin-top: 3px; display: flex; gap: 10px; flex-wrap: wrap; }
.card .who { color: var(--ink-2); font-weight: 500; }
.card.live { border-color: rgba(19, 160, 111, .35); }
.card.ask { border-color: rgba(217, 150, 15, .45); background: rgba(255, 249, 235, .85); }
.btns { display: flex; gap: 8px; margin-top: 9px; }
.btn { padding: 8px 14px; border-radius: 10px; font-size: 13px; font-weight: 600; min-height: 36px;
  border: 1px solid var(--hair); background: #fff; transition: background .25s, color .25s, transform .2s var(--ease-out); }
.btn:active { transform: scale(.97); }
.btn.yes { background: var(--ink); color: #fff; border-color: var(--ink); }
.btn.yes.confirm { background: var(--working); border-color: var(--working); }
.btn[disabled] { opacity: .5; cursor: default; }

/* panel content */
.p-head { padding: max(18px, env(safe-area-inset-top)) 22px 6px; }
.p-head .swatch { display: block; width: 36px; height: 4px; border-radius: 2px; background: var(--team); margin-bottom: 12px; }
.p-head h2 { margin: 0; font-size: 32px; }
.p-head p { margin: 4px 0 0; color: var(--ink-2); font-size: 13.5px; max-width: 34em; }
/* stays in reach while the panel scrolls */
.close { position: sticky; z-index: 3; float: right; top: max(14px, env(safe-area-inset-top)); margin: max(14px, env(safe-area-inset-top)) 14px 0 0; width: 40px; height: 40px;
  border-radius: 50%; display: grid; place-items: center; background: rgba(255, 255, 255, .85); border: 1px solid var(--hair);
  font-size: 20px; line-height: 1; transition: transform .3s var(--ease-out); }
.close:hover { transform: rotate(90deg); }
.p-body { padding: 0 22px; }
.state-line { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--ink-2); margin-top: 10px; }
.agent { padding: 12px 14px; border-radius: 14px; background: rgba(255, 255, 255, .75); border: 1px solid var(--hair); }
.agent + .agent { margin-top: 8px; }
.agent .nm { display: flex; align-items: center; gap: 8px; font-weight: 600; }
.agent .nm small { font-weight: 400; color: var(--ink-3); font-size: 12px; }
.agent .ttl { font-size: 12.5px; color: var(--ink-2); margin-top: 1px; }
.agent dl { display: grid; grid-template-columns: auto 1fr; gap: 3px 12px; margin: 9px 0 0; font-size: 12.5px; }
.agent dt { color: var(--ink-3); }
.agent dd { margin: 0; color: var(--ink); min-width: 0; overflow-wrap: anywhere; }
.subs { margin-top: 9px; padding-left: 12px; border-left: 2px solid var(--team); display: grid; gap: 4px; font-size: 12.5px; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { font-size: 12.5px; padding: 5px 10px; border-radius: 999px; background: rgba(255, 255, 255, .8); border: 1px solid var(--hair); }
.chip.plug::before { content: ""; display: inline-block; width: 6px; height: 6px; border-radius: 50%; background: var(--team); margin-right: 6px; vertical-align: 1px; }
.preview { border-radius: 14px; overflow: hidden; background: #fff; border: 1px solid var(--hair);
  box-shadow: 0 18px 30px -24px rgba(20, 36, 59, .6); }
.preview .bar { display: flex; justify-content: space-between; gap: 10px; padding: 9px 12px; font-size: 12px; color: var(--ink-2);
  border-bottom: 1px solid var(--hair); background: rgba(245, 244, 241, .9); }
.preview .bar b { font-weight: 600; color: var(--ink); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.preview .doc { max-height: 340px; overflow: auto; padding: 14px 16px; font-size: 13px; line-height: 1.55; }
.preview .doc h4 { font: 600 16px/1.3 var(--display); margin: 12px 0 4px; }
.preview .doc h4:first-child { margin-top: 0; }
.preview .doc p { margin: 0 0 6px; }
.preview .doc li { margin-left: 14px; list-style: disc; }
.preview img { display: block; width: 100%; height: auto; max-height: 420px; object-fit: contain; background: #f3f3f3; }
.preview.none { padding: 16px; color: var(--ink-3); font-size: 13px; box-shadow: none; background: rgba(255, 255, 255, .6); }
.work li button { text-align: left; width: 100%; }
.work li button:hover .t { text-decoration: underline; text-decoration-color: var(--hair); }
.note { margin: 22px 0 0; font-size: 12px; color: var(--ink-3); }
.status-word { font-size: 12px; font-weight: 500; }

#source { position: fixed; z-index: 6; left: 20px; bottom: max(14px, env(safe-area-inset-bottom)); margin: 0; max-width: 520px;
  font-size: 12px; color: var(--ink-2); padding: 7px 12px; border-radius: 10px; background: rgba(255, 255, 255, .7);
  backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); }
#nogl { position: fixed; z-index: 7; left: 50%; top: 45%; transform: translate(-50%, -50%); max-width: 340px; text-align: center;
  padding: 16px 18px; border-radius: 14px; background: var(--glass-strong); font-size: 14px; }

/* ---------------------------------------------------------------- phone */
@media (max-width: 860px) {
  #bar { gap: 8px; padding: max(10px, env(safe-area-inset-top)) 12px 8px; flex-wrap: wrap; }
  .mark { padding: 8px 12px 7px; }
  .mark .word { font-size: 21px; }
  .mark .sub { display: none; }
  .stats { order: 3; flex-basis: 100%; justify-content: space-between; padding: 4px; }
  .stat { min-width: 0; padding: 3px 8px; }
  .stat dd { font-size: 19px; }
  .stat dt { font-size: 11px; }
  .conn { margin-left: auto; padding: 7px 10px; }
  .conn span { display: none; }
  .links a.office { display: none; }
  #source { display: none; }
  .tag { max-width: 150px; padding: 6px 9px; }
  .tag .now, .tag .tool { display: none; }
  .tag .row { font-size: 12.5px; }
  #today { top: auto; left: 0; right: 0; bottom: 0; width: auto; height: 74vh; border-radius: 22px 22px 0 0;
    padding: 0 16px max(18px, env(safe-area-inset-bottom)); transform: translateY(calc(100% - var(--peek, 150px)));
    transition: transform .55s var(--ease-out), opacity .4s; }
  body.today-open #today { transform: none; }
  body.panel-open #today { transform: translateY(100%); }
  .grip { display: block; position: sticky; top: 0; z-index: 2; width: calc(100% + 32px); margin: 0 -16px; padding: 10px 16px 2px;
    background: linear-gradient(var(--glass-strong) 70%, rgba(255, 255, 255, 0)); }
  .grip::before { content: ""; display: block; width: 40px; height: 5px; border-radius: 3px; background: rgba(20, 36, 59, .25); margin: 0 auto 4px; }
  .grip .gt { display: block; margin: 4px 0 0; font: 500 22px/1.15 var(--display); text-align: left; }
  .desk-only { display: none; }
  .grip .peek { display: block; text-align: left; font-size: 12.5px; color: var(--ink-2); }
  #panel { top: auto; left: 0; width: 100%; height: 62vh; border-radius: 22px 22px 0 0; transform: translateY(105%); }
  .p-head { padding-top: 18px; }
  .p-head h2 { font-size: 27px; }
}
@media (min-width: 861px) { .grip .peek { display: none; } }
/* without WebGL the suite labels become a plain list */
.no3d #labels { position: fixed; inset: auto; top: 150px; left: 20px; display: grid; gap: 8px; width: min(300px, calc(100vw - 40px)); }
.no3d .tag { position: static; transform: none !important; opacity: 1 !important; max-width: none; }
.no3d #nogl { top: auto; bottom: 20px; left: 20px; transform: none; text-align: left; }
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition-duration: .01ms !important; }
}
</style>
</head>
<body>
<canvas id="scene" class="grab" tabindex="-1" aria-label="3D view of JARVIS HQ: eight team suites around JARVIS, above the harbour"></canvas>
<div id="veil"></div>
<div id="labels"></div>

<header id="bar">
  <a class="mark" href="/hq" aria-label="JARVIS HQ"><span class="word">JARVIS <em>HQ</em></span><span class="sub">Urban Supplied</span></a>
  <dl class="stats" id="stats" aria-live="polite"></dl>
  <div class="conn" id="conn" role="status"><i></i><span>Connecting</span></div>
  <nav class="links"><a class="office" href="/">Office</a><a class="talk" href="/chat">Talk to JARVIS</a></nav>
</header>

<aside id="today" class="sheet" aria-label="Today">
  <button class="grip" id="grip" aria-expanded="false" aria-controls="today"><span class="gt">Today</span><span class="peek" id="peek"></span></button>
  <h2 class="desk-only" id="today-title">Today</h2>
  <h3>Running <span class="n" id="n-running"></span></h3>
  <ol id="t-running"></ol>
  <h3>Needs your approval <span class="n" id="n-approve"></span></h3>
  <ol id="t-approve"></ol>
  <h3 id="h-done">Done today <span class="n" id="n-done"></span></h3>
  <ol id="t-done"></ol>
</aside>

<aside id="panel" class="sheet" role="dialog" aria-modal="false" aria-labelledby="p-title">
  <button class="close" id="close" aria-label="Close">&times;</button>
  <div id="p-content"></div>
</aside>

<p id="source"></p>
<div id="nogl" hidden></div>

<script>window.JARVIS_TOKEN = "__JARVIS_TOKEN__";</script>
<script type="module" src="/hq.js"></script>
</body>
</html>
