<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#020814">
<title>JARVIS</title>
<link rel="icon" href="data:,">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@1,6..72,400;1,6..72,500&family=Saira:wdth,wght@75..100,400..700&display=swap" rel="stylesheet">
<style>
:root {
  /* The speaking stage (T86): the reel's control-room screen. Deep instrument blue, an electric arc for the orb,
     ice for lines and figures, amber only for what needs the owner. */
  --abyss: #020814; --deep: #07142b; --deep-2: #0c1f40; --arc: #2e86ff; --ice: #a9dbff; --paper: #e8f1ff;
  --mute: #7d93b5; --signal: #ffb23e; --good: #57e3a6;
  --line: rgba(169, 219, 255, .18); --line-hi: rgba(169, 219, 255, .45);
  --ui: "Saira", "Segoe UI", system-ui, sans-serif; --voice: "Newsreader", Georgia, serif;
  --gutter: 16px; --bar-h: 64px;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body {
  background: radial-gradient(120% 80% at 50% 30%, #071a3a 0%, var(--abyss) 62%) fixed, var(--abyss);
  color: var(--paper); font: 400 15px/1.45 var(--ui); font-stretch: 92%;
  -webkit-font-smoothing: antialiased; overflow: hidden;
}
button, input { font: inherit; color: inherit; }
a { color: var(--ice); }
:focus-visible { outline: 2px solid var(--ice); outline-offset: 2px; }

/* ---------------------------------------------------------------- frame */
.app { position: fixed; inset: 0; display: grid; grid-template-rows: auto 1fr auto; }
header { display: flex; align-items: center; gap: 14px; padding: max(10px, env(safe-area-inset-top)) var(--gutter) 10px; }
.mark { font-weight: 650; font-stretch: 78%; font-size: 19px; letter-spacing: .14em; color: var(--paper); }
.conn { display: inline-flex; align-items: center; gap: 7px; font-size: 13px; color: var(--mute); }
.conn i { width: 7px; height: 7px; border-radius: 50%; background: #c45; }
.conn.live i { background: var(--good); box-shadow: 0 0 8px var(--good); }
header nav { margin-left: auto; display: flex; gap: 4px; }
header nav a, header nav button {
  font-size: 13px; color: var(--mute); text-decoration: none; padding: 6px 10px; border-radius: 6px;
  background: none; border: 1px solid transparent; cursor: pointer;
}
header nav a:hover, header nav button:hover { color: var(--paper); border-color: var(--line); }

main { position: relative; min-height: 0; display: grid; grid-template-columns: minmax(0, 5fr) minmax(0, 6fr); }

/* ---------------------------------------------------------------- orb column */
.presence { position: relative; display: grid; grid-template-rows: 1fr auto auto; align-items: center; justify-items: center; padding: 0 var(--gutter) 18px; min-height: 0; }
.orb { position: relative; width: min(100%, 62vh, 560px); aspect-ratio: 1; align-self: center; }
.orb canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
.state { font-size: 13px; color: var(--ice); letter-spacing: .06em; font-stretch: 80%; height: 18px; }
.line {
  margin: 8px 0 0; max-width: 34ch; min-height: 2.8em; text-align: center;
  font: italic 400 clamp(19px, 2.2vw, 25px)/1.38 var(--voice); color: var(--paper);
}
.line .said { color: var(--paper); } .line .tosay { color: rgba(232, 241, 255, .38); }
.ticker { width: min(100%, 460px); margin: 18px 0 0; padding: 0; list-style: none; font-size: 13px; color: var(--mute); }
.ticker li { display: flex; gap: 10px; padding: 5px 0; border-top: 1px solid var(--line); }
.ticker li time { color: var(--mute); font-variant-numeric: tabular-nums; flex: none; opacity: .7; }
.ticker li b { color: var(--paper); font-weight: 500; }
.ticker li.live::before { content: ""; flex: none; width: 6px; height: 6px; margin-top: 7px; border-radius: 50%; background: var(--arc); box-shadow: 0 0 8px var(--arc); animation: blink 1.4s infinite; }

/* ---------------------------------------------------------------- the stage */
.stage { position: relative; min-height: 0; overflow-y: auto; padding: 8px var(--gutter) 24px 8px; scroll-behavior: smooth; overscroll-behavior: contain; }
.stage-head { display: flex; align-items: baseline; gap: 10px; margin: 6px 0 12px; font-size: 13px; color: var(--mute); }
.stage-head h2 { margin: 0; font-size: 15px; font-weight: 600; color: var(--paper); font-stretch: 85%; }
.stage-head .demo-tag { color: var(--signal); }
.beat { display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); gap: 12px; margin-bottom: 14px; transition: opacity .5s, filter .5s; }
.beat.past { opacity: .42; filter: saturate(.6); }
.beat.past:hover, .beat.past:focus-within { opacity: 1; filter: none; }
.beat .cue { grid-column: 1 / -1; margin: 0; font: italic 400 14px/1.3 var(--voice); color: var(--mute); }

.card {
  position: relative; padding: 14px 16px 15px; min-width: 0;
  background: linear-gradient(180deg, rgba(12, 31, 64, .92), rgba(7, 20, 43, .92));
  border: 1px solid var(--line); border-radius: 4px;
  animation: rise .5s cubic-bezier(.2, .8, .2, 1) both;
}
/* corner brackets: the reel's screen panels */
.card::before, .card::after { content: ""; position: absolute; width: 12px; height: 12px; border: 1.5px solid var(--ice); opacity: .7; }
.card::before { top: -1px; left: -1px; border-right: 0; border-bottom: 0; }
.card::after { bottom: -1px; right: -1px; border-left: 0; border-top: 0; }
.card.wide { grid-column: 1 / -1; }
.card.needs { border-color: rgba(255, 178, 62, .55); }
.card.needs::before, .card.needs::after { border-color: var(--signal); }
.kind { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; font-size: 12.5px; color: var(--mute); }
.kind .id { color: var(--ice); font-weight: 600; font-variant-numeric: tabular-nums; }
.chip { margin-left: auto; font-size: 11.5px; padding: 1px 8px; border-radius: 99px; border: 1px solid var(--line-hi); color: var(--ice); white-space: nowrap; }
.chip.warn { border-color: var(--signal); color: var(--signal); }
.chip.ok { border-color: var(--good); color: var(--good); }
.figure { font-weight: 600; font-stretch: 75%; font-size: clamp(46px, 6.4vw, 72px); line-height: .95; color: var(--paper); font-variant-numeric: tabular-nums; letter-spacing: -.01em; text-shadow: 0 0 24px rgba(46, 134, 255, .55); }
.label { font-size: 15px; color: var(--ice); margin-top: 4px; }
.title { font-size: 16px; line-height: 1.32; font-weight: 500; }
.detail { font-size: 13px; color: var(--mute); margin-top: 6px; overflow-wrap: anywhere; }
.rank { list-style: none; margin: 4px 0 0; padding: 0; }
.rank li { display: grid; grid-template-columns: 28px 1fr; align-items: center; gap: 10px; padding: 8px 0; border-top: 1px solid var(--line); font-size: 16px; animation: rise .45s cubic-bezier(.2, .8, .2, 1) both; }
.rank li:first-child { border-top: 0; }
.rank li span { width: 26px; height: 26px; display: grid; place-items: center; border-radius: 50%; border: 1px solid var(--line-hi); font-size: 12px; color: var(--ice); font-variant-numeric: tabular-nums; }
.when { display: flex; gap: 14px; align-items: center; }
.cal { flex: none; width: 64px; border: 1px solid var(--line-hi); border-radius: 4px; overflow: hidden; text-align: center; }
.cal i { display: block; font-style: normal; font-size: 12px; font-weight: 600; padding: 3px 0; background: var(--arc); color: var(--abyss); }
.cal b { display: block; font-weight: 600; font-stretch: 75%; font-size: 20px; padding: 6px 0; font-variant-numeric: tabular-nums; }
.shot { display: block; width: 100%; max-height: 220px; object-fit: cover; border-radius: 2px; margin-top: 8px; border: 1px solid var(--line); }
.acts { display: flex; gap: 8px; margin-top: 12px; flex-wrap: wrap; }
.btn { cursor: pointer; padding: 7px 14px; border-radius: 4px; border: 1px solid var(--line-hi); background: rgba(169, 219, 255, .05); font-size: 14px; font-weight: 500; }
.btn:hover { background: rgba(169, 219, 255, .12); }
.btn.go { background: var(--signal); border-color: var(--signal); color: #1b1203; }
.btn.go:hover { filter: brightness(1.08); }
.reasons { margin: 8px 0 0; padding-left: 18px; color: var(--ice); font-size: 14px; }
.reasons li { margin: 3px 0; }

.empty { color: var(--mute); font-size: 14px; max-width: 46ch; }
.empty p { margin: 0 0 10px; }

/* ---------------------------------------------------------------- talk bar */
.talk { display: flex; gap: 8px; align-items: center; padding: 10px var(--gutter) max(10px, env(safe-area-inset-bottom)); border-top: 1px solid var(--line); background: rgba(2, 8, 20, .82); backdrop-filter: blur(10px); }
.talk input { flex: 1; min-width: 0; height: 44px; padding: 0 14px; border-radius: 4px; border: 1px solid var(--line-hi); background: rgba(12, 31, 64, .7); font-size: 16px; }
.talk input::placeholder { color: var(--mute); }
.icon { flex: none; width: 44px; height: 44px; display: grid; place-items: center; cursor: pointer; border-radius: 4px; border: 1px solid var(--line-hi); background: rgba(12, 31, 64, .7); }
.icon svg { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.icon.on { border-color: var(--arc); color: var(--ice); box-shadow: 0 0 0 1px var(--arc) inset; }
.icon.hot { background: var(--arc); border-color: var(--arc); color: #fff; }
.icon.off { color: var(--mute); }
.toast { position: fixed; left: 50%; bottom: calc(var(--bar-h) + 18px + env(safe-area-inset-bottom)); transform: translateX(-50%); max-width: calc(100vw - 32px); padding: 10px 14px; border-radius: 4px; background: #2a1110; border: 1px solid #8a3a33; color: #ffd7d2; font-size: 14px; display: none; z-index: 5; }
.toast.on { display: block; }

@keyframes rise { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }
@keyframes blink { 50% { opacity: .3; } }

/* ---------------------------------------------------------------- phone */
@media (max-width: 900px) {
  body { overflow: auto; }
  .app { position: static; min-height: 100dvh; display: flex; flex-direction: column; }
  main { display: flex; flex-direction: column; flex: 1; }
  .presence { position: sticky; top: 0; z-index: 2; padding: 0 var(--gutter) 10px; grid-template-rows: auto auto auto;
    background: var(--abyss); }
  .presence::after { content: ""; position: absolute; left: 0; right: 0; top: 100%; height: 22px; pointer-events: none;
    background: linear-gradient(180deg, var(--abyss), rgba(2, 8, 20, 0)); }
  .orb { width: min(64vw, 34dvh, 300px); transition: width .45s ease; }
  .app.busy .orb { width: min(36vw, 20dvh, 170px); }
  .line { font-size: 18px; min-height: 0; max-width: 32ch; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
  header { position: relative; z-index: 3; }
  .ticker { display: none; }
  .stage { overflow: visible; padding: 4px var(--gutter) calc(var(--bar-h) + 24px + env(safe-area-inset-bottom)); }
  .beat { grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; }
  .figure { font-size: 54px; }
  .card.txt { grid-column: 1 / -1; }
  .talk { position: fixed; left: 0; right: 0; bottom: 0; z-index: 3; }
  header nav .wide-only { display: none; }
}
@media (prefers-reduced-motion: reduce) {
  .card, .rank li { animation: none; }
  .stage { scroll-behavior: auto; }
}
</style>
</head>
<body>
<div class="app" id="app">
  <header>
    <span class="mark">JARVIS</span>
    <span class="conn" id="conn"><i></i><span>Connecting</span></span>
    <nav aria-label="Other views">
      <button type="button" id="demo" title="Plays sample lines with sample data, clearly marked">Play a demo</button>
      <a href="/chat" class="wide-only">Chat</a>
      <a href="/hq">HQ</a>
    </nav>
  </header>
  <main>
    <section class="presence" aria-label="JARVIS">
      <div class="orb"><canvas id="orb" aria-hidden="true"></canvas></div>
      <div class="state" id="state">Standing by</div>
      <p class="line" id="line" aria-live="polite"></p>
      <ul class="ticker" id="ticker" aria-label="What JARVIS and the team are doing"></ul>
    </section>
    <section class="stage" id="stage" aria-label="What JARVIS is talking about" aria-live="polite"></section>
  </main>
  <form class="talk" id="talk" autocomplete="off">
    <button type="button" class="icon" id="mic" aria-label="Talk to JARVIS"><svg viewBox="0 0 24 24"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg></button>
    <input id="text" placeholder="Ask JARVIS" aria-label="Message to JARVIS" enterkeyhint="send">
    <button type="button" class="icon" id="speak" aria-label="Voice on" aria-pressed="true"><svg viewBox="0 0 24 24"><path d="M4 9h4l5-4v14l-5-4H4z"/><path d="M17 8.5a5 5 0 0 1 0 7M19.5 6a8.5 8.5 0 0 1 0 12"/></svg></button>
    <button type="submit" class="icon" aria-label="Send"><svg viewBox="0 0 24 24"><path d="M4 12h15M13 6l6 6-6 6"/></svg></button>
  </form>
</div>
<div class="toast" id="toast" role="alert"></div>

<script>window.JARVIS_TOKEN = "__JARVIS_TOKEN__";</script>
<script src="/jarvis.js"></script>
<script src="/stage.js"></script>
</body>
</html>
